# Mendix v9 build-toolchain versions verified against this crate.
# When adding a new version: build the image, smoke-test (build a known .mpr +
# mx check), then add the row. The build toolchain (mxbuild + mx) ships on the
# same CDN as the runtime, as mxbuild-<version>.tar.gz.

crate_version: "0.1.1"
default_mendix_version: "9.24.20.33307"

supported:
  - mendix_version: "9.24.20.33307"
    cdn_url: "https://cdn.mendix.com/runtime/mxbuild-9.24.20.33307.tar.gz"
    java_version: 11          # JDK (mxbuild compiles javasource at release 11)
    cdn_status: "200 (verified 2026-06-23)"
    image_smoke: >
      ATTEMPTED 2026-09-18, NOT YET PRODUCING AN .mda - named honestly rather than left silent.
      The compile attempt ran against a project whose `theme/`, `resources/` and `javasource/`
      directories were all locally empty. mxbuild reported a real verdict, not a mount problem
      (the sentinel mount-proof passed first): 1,336+ cascading errors (mxbuild's own cap on
      how many it will list) - "Could not find widget '<Name>' in the 'widgets' directory" for
      every pluggable-widget reference, plus "Design property <X> is not supported by your
      theme" for every styled element, because there was no theme content to check the
      properties against. Closing this row for real needs a full project export (theme +
      widgets + javasource populated), which this run did not have licensed access to obtain
      from this host. Not a regression: this major has never produced an `.mda` in this crate.
    check_command: >
      AVAILABLE on this major - verified via `docker run --entrypoint /opt/mxtools/modeler/mx
      <image> --help` (2026-09-18): `check`, `convert`, `create-project`, `update-widgets`,
      `collect-native-deps`, `show-version` are all present. `check` first appears at Mendix 9;
      it is absent on 7 and 8 (see their versions.yaml). Not independently smoke-tested against
      a full project this pass - it needs the same complete project content `build` does and
      would fail the same way against this run's incomplete checkout.
    notes: "Pairs with the mendix-9 runtime crate (same default version)."

  - mendix_version: "9.24.36.73625"
    cdn_url: "https://cdn.mendix.com/runtime/mxbuild-9.24.36.73625.tar.gz"
    java_version: 11          # JDK (mxbuild compiles javasource at release 11)
    cdn_status: "200 (verified 2026-09-18)"
    image_build: >
      verified 2026-09-18 - builds clean from the unmodified crate recipe (fresh image, this
      exact tag had never been built before), 43s wall on one 40-core Linux host (Docker 29.6.1,
      overlayfs, no --platform emulation - native x86_64 host).
    image_smoke: >
      VERIFIED 2026-09-18 - this crate's FIRST `.mda`-producing smoke on Mendix 9. The Edubond V2
      fixture (matching this crate's own runtime-side `planned:` entry in
      ../versions.yaml) - a real, full-content project (javasource 1,677 files / theme 197 /
      widgets 52 / userlib 301, 2,704 files staged) - compiled end to end: `BUILD SUCCEEDED`, a
      188,736,234-byte (180 MB) / 4,020-entry `.mda`, 124s wall on one 40-core Linux host.
      Verified as a real zip archive containing `model/model.mdp` via `python3 -m zipfile`
      (`testzip()` returned None - no corrupt members), not just a non-zero exit. The project is
      not committed here and is not ours to publish - what is published is the measurement. The
      on-disk checkout has two DECOY zero-byte `.mpr` files alongside the real one (`App.mpr`,
      `Edubond V2.mpr`) - staged a clean copy excluding both before handing it to the oracle,
      since a naive `find … -name '*.mpr' | head -1` would pick a decoy alphabetically and read
      as an empty/unusable project.
    check_command: >
      Not independently smoke-tested against this project this pass (see the 9.24.20.33307 row
      above for the general `mx check` availability finding - unaffected by this row, which is
      only about `build`).
    notes: >
      Newer than the crate default (9.24.20.33307); both are supported. Nothing in the recipe is
      version-specific beyond MENDIX_VERSION - this row required no Dockerfile change.

planned:
  - mendix_version: "9.24.0"
