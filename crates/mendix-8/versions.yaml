# Mendix v8 versions verified against this crate.
# When adding a new version, build + smoke-test it, then add the row.
#
# MX8 is out of standard Mendix support, but the FINAL 8.18 LTS patch
# (8.18.35.97) is still served from the public CDN — so it is a normal
# recipe-pull crate. Older MX8 patches are NOT all CDN-hosted (e.g.
# 8.18.21.4259 → 404); for those see PORTAL-DOWNLOAD.md.

crate_version: "0.1.0"
default_mendix_version: "8.18.35.97"

supported:
  - mendix_version: "8.18.35.97"
    cdn_url: "https://cdn.mendix.com/runtime/mendix-8.18.35.97.tar.gz"
    java_version: 11               # MX 8.18 is certified on Java 8 AND 11; 11 chosen here
    cdn_status: "200 (verified 2026-06-23)"
    image_smoke: "pending"         # no MX8 fixture app in the corpus yet
    notes: >
      Final Mendix 8.18 LTS patch; CDN-available. Java 11 base (runs Java-8
      bytecode); rebuild on Temurin 8 if your app pins Java 8.
    tarball_sha256: "8004a97377791cc77c096e11f72937cbd2cc1b5b462dd8367118996e885c4ed8"
    tarball_sha256_source: "Mendix publishes no .sha256 for this tarball (HTTP 404); two independent fetches from two hosts agree"
    verified_2026_11_17: >
      VERIFIED 2026-11-17 on one Linux x86_64 host, images built from this repo at 2c8e8c72: build/tests/smoke-test.sh PASS - production-app-8 (a real full-content project of this exact Mendix version, used because this major's mx cannot create one; the project is not in this repo and not ours to publish, only this measurement is) compiled to an .mda (134M) whose model/metadata.json RuntimeVersion is 8.18.35.97; tests/smoke-test.sh PASS - that .mda served by this crate's runtime image with postgres (docker-compose.smoke.yml, MENDIX_VERSION=8.18.35.97), HTTP 200 at :8080.

  - mendix_version: "8.18.27.17745"
    cdn_url: "https://cdn.mendix.com/runtime/mendix-8.18.27.17745.tar.gz"
    tarball_sha256: "b793345e939c23af841de7a929f7678cfed78bbac17cd5d76cfdd515d76243b0"
    tarball_sha256_source: "Mendix publishes no .sha256 for this tarball (HTTP 404); two independent fetches from two hosts agree"
    java_version: 8
    verified_with:
      - production-app-8b  # real full-content project of this version, not published
    verified_at: "2026-11-17"
    verified_2026_11_17: >
      VERIFIED 2026-11-17 on one Linux x86_64 host, images built from this repo at 2c8e8c72: build/tests/smoke-test.sh PASS - production-app-8b (a real full-content project of this exact Mendix version, used because this major's mx cannot create one; the project is not in this repo and not ours to publish, only this measurement is) compiled to an .mda (104M) whose model/metadata.json RuntimeVersion is 8.18.27.17745; tests/smoke-test.sh PASS - that .mda served by this crate's runtime image with postgres (docker-compose.smoke.yml, MENDIX_VERSION=8.18.27.17745), HTTP 200 at :8080.
    notes: "Nothing in the recipe is version-specific beyond MENDIX_VERSION; this row required no Dockerfile change."

# Older MX8 patches that are NOT on the public CDN — obtain via the Mendix
# portal (see PORTAL-DOWNLOAD.md) and override RUNTIME_CDN_BASE at build.
portal_only:
  - mendix_version: "8.18.21.4259"
    cdn_status: "404 (not hosted)"
    obtain: "Mendix portal / Studio Pro 8 install — see PORTAL-DOWNLOAD.md"
